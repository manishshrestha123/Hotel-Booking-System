<div class="card">
  <h2>Add New Room</h2>
  <p class="subtitle">Create a new room and upload its primary image.</p>

  <div class="alert-success" *ngIf="successMsg">{{ successMsg }}</div>
  <div class="alert-error" *ngIf="errorMsg">{{ errorMsg }}</div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-row">
      <div class="form-group" [class.has-error]="form.get('roomNumber')?.invalid && form.get('roomNumber')?.touched">
        <label>Room Number</label>
        <input type="text" formControlName="roomNumber" placeholder="e.g. 101, 102A" />
      </div>

      <div class="form-group" [class.has-error]="form.get('roomTypeId')?.invalid && form.get('roomTypeId')?.touched">
        <label>Room Type</label>
        <select formControlName="roomTypeId">
          <option value="">-- Select Type --</option>
          <option *ngFor="let t of roomTypes" [value]="t.id">{{ t.name }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group" [class.has-error]="form.get('pricePerNight')?.invalid && form.get('pricePerNight')?.touched">
        <label>Price Per Night ($)</label>
        <input type="number" formControlName="pricePerNight" placeholder="0.00" min="0" step="0.01" />
      </div>

      <div class="form-group">
        <label>Primary Image</label>
        <div class="file-upload-wrap">
          <input type="file" (change)="onFileSelected($event)" accept="image/*" />
        </div>
      </div>
    </div>

    <button type="submit" class="btn-submit" [disabled]="isLoading"> 
       <span *ngIf="!isLoading">Create Room</span>
       <span *ngIf="isLoading">Saving...</span>
    </button>
  </form>
</div>
