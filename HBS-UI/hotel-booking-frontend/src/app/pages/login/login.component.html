<div class="login-wrapper">
  <div class="login-box">
    <h2>Welcome Back</h2>
    <p>Please login to your account</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input formControlName="email" type="email" placeholder="Enter your email" />
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-msg">
          Valid email is required.
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input formControlName="password" type="password" placeholder="Enter your password" />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-msg">
          Password is required.
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert-msg">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid">Login</button>
    </form>
     <div class="signup-link">
      <p>Don't have an account? <a routerLink="/register">Sign up</a></p>
    </div>
  </div>
</div>
