<div class="login-wrapper">
  <div class="login-box">
    <div class="brand">
      <span class="icon">PrimeStay</span>
    </div>
    <h2>Customer Login</h2>
    <p>Sign in with your customer username and password, or continue as a guest.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username or Email</label>
        <input formControlName="identifier" type="text" placeholder="customer01 or customer@example.com" />
        <div *ngIf="loginForm.get('identifier')?.invalid && loginForm.get('identifier')?.touched" class="error-msg">
          Username or email is required.
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input formControlName="password" type="password" placeholder="Password" />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-msg">
          Password is required.
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert-msg">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Customer Login</span>
        <span *ngIf="isLoading">Authenticating...</span>
      </button>
    </form>

    <button type="button" class="btn-guest" (click)="continueAsGuest()">
      Continue as Guest
    </button>

    <div class="signup-link">
      <p><a routerLink="/admin/login">Admin login</a></p>
      <p style="margin-top: 10px;"><a routerLink="/home" style="color: #a0a0ab;">Back to Home</a></p>
    </div>
  </div>
</div>
